<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resgatar Acesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-full mb-3 text-white">
        <i class="fa-solid fa-key text-xl"></i>
      </div>
      <h1 class="text-2xl font-bold">Resgatar Acesso</h1>
      <p class="text-slate-400 text-sm mt-1">Cole o seu código de liberação abaixo</p>
    </div>

    <!-- Campo de Entrada -->
    <div class="space-y-4" id="formSection">
      <div>
        <input type="text" id="codigoInput" placeholder="Ex: ABC-1234" 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-center text-lg uppercase tracking-widest font-mono text-white focus:outline-none focus:border-blue-500">
      </div>
      
      <button onclick="resgatarCodigo()" id="btnResgatar"
              class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
        <span>Liberar Acesso</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <div id="mensagemErro" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-sm text-center"></div>
    </div>

    <!-- Área com as informações liberadas -->
    <div id="resultadoSection" class="hidden space-y-4 mt-6 border-t border-slate-700 pt-6">
      <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-3 rounded-lg text-sm text-center mb-4">
        <i class="fa-solid fa-circle-check mr-1"></i> Acesso liberado com sucesso!
      </div>

      <!-- Usuário -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Usuário</label>
        <div class="flex items-center gap-2">
          <input type="text" id="outUsuario" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono">
          <button onclick="copiar('outUsuario')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- Senha -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Senha</label>
        <div class="flex items-center gap-2">
          <input type="text" id="outSenha" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono">
          <button onclick="copiar('outSenha')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- DNS / URL -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Servidor / DNS / URL</label>
        <div class="flex items-center gap-2">
          <input type="text" id="outDns" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono">
          <button onclick="copiar('outDns')" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- Instruções -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Instruções de Instalação</label>
        <div id="outInstrucoes" class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-300 whitespace-pre-wrap"></div>
      </div>
    </div>

  </div>

  <script>
    // Configurações do Supabase (Substitua pelos seus dados)
    const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
    const SUPABASE_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function resgatarCodigo() {
      const codigoInput = document.getElementById('codigoInput');
      const codigo = codigoInput.value.trim();
      const msgErro = document.getElementById('mensagemErro');
      const btn = document.getElementById('btnResgatar');

      msgErro.classList.add('hidden');

      if (!codigo) {
        msgErro.innerText = 'Por favor, digite o seu código!';
        msgErro.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verificando...';

      const { data, error } = await _supabase.rpc('resgatar_login', { codigo_digitado: codigo });

      btn.disabled = false;
      btn.innerHTML = '<span>Liberar Acesso</span><i class="fa-solid fa-arrow-right"></i>';

      if (error) {
        msgErro.innerText = 'Erro ao processar código: ' + error.message;
        msgErro.classList.remove('hidden');
        return;
      }

      if (!data.sucesso) {
        msgErro.innerText = data.mensagem;
        msgErro.classList.remove('hidden');
        return;
      }

      // Preenche as informações
      document.getElementById('outUsuario').value = data.usuario || '';
      document.getElementById('outSenha').value = data.senha || '';
      document.getElementById('outDns').value = data.dns_url || '';
      document.getElementById('outInstrucoes').innerText = data.instrucoes || 'Sem instruções adicionais.';

      // Exibe a seção de resultados
      document.getElementById('resultadoSection').classList.remove('hidden');
      codigoInput.disabled = true;
      btn.disabled = true;
    }

    function copiar(idInput) {
      const input = document.getElementById(idInput);
      input.select();
      navigator.clipboard.writeText(input.value);
      alert('Copiado para a área de transferência!');
    }
  </script>
</body>
</html>

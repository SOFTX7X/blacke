<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKE LAVEX — Mural anônimo</title>
  <meta name="theme-color" content="#06070d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./">
      <span class="logo-ring"><img id="logoImg" src="logo.png" alt="Logo BLACKE LAVEX"></span>
      <span class="brand-name">BLACKE <b>LAVEX</b></span>
    </a>
    <button class="btn-primary" onclick="abrirModal()">
      <i class="fa-solid fa-plus"></i><span>Publicar link</span>
    </button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1 id="heroTitle" data-text="Mural de sites e marcas">Mural de sites e marcas</h1>
        <p class="hero-sub">Publique seu link com capa e legenda. Sem conta, sem cadastro.</p>
      </div>
      <div class="searchbar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="busca" type="search" placeholder="Buscar por nome ou legenda" autocomplete="off">
        <span id="contador" class="count"></span>
      </div>
    </section>

    <section id="muralGrid" class="grid" aria-live="polite"></section>

    <div id="estado" class="estado"></div>
  </main>

  <footer>BLACKE LAVEX · rede privada</footer>

  <!-- Modal -->
  <div id="modalCadastro" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <div class="sheet-head">
        <h3 id="modalTitulo">Publicar no mural</h3>
        <button class="icon-btn" onclick="fecharModal()" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <label class="field-label">Capa</label>
      <div id="uploadArea" class="upload" onclick="document.getElementById('fileInput').click()" tabindex="0">
        <i class="fa-solid fa-image"></i>
        <span>Clique para escolher a imagem de capa</span>
        <small>até 5 MB</small>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden onchange="processarImagem(event)">
      <div id="previewContainer" class="preview" hidden>
        <img id="imagePreview" src="" alt="Prévia da capa">
        <button class="icon-btn trash" onclick="removerImagem()" aria-label="Remover imagem"><i class="fa-solid fa-trash"></i></button>
      </div>

      <label class="field-label" for="inputNome">Nome da marca ou site</label>
      <input class="field" type="text" id="inputNome" placeholder="Ex: Anonymous BR" maxlength="60">

      <label class="field-label" for="inputLink">Link</label>
      <input class="field" type="url" id="inputLink" placeholder="https://">

      <label class="field-label" for="inputLegenda">Legenda</label>
      <textarea class="field" id="inputLegenda" rows="3" placeholder="Em uma ou duas frases, o que as pessoas encontram aí?" maxlength="200"></textarea>

      <div id="formErro" class="erro" hidden></div>

      <button class="btn-primary wide" id="btnSalvar" onclick="salvarSite()">Publicar</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>

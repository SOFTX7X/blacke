<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resgatar Acesso - IPTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="text-2xl font-bold">Resgatar Acesso</h1>
      <p class="text-slate-400 text-sm">Digite o seu código de liberação abaixo</p>
    </div>

    <div class="space-y-4">
      <input type="text" id="codigoInput" placeholder="Ex: IPTV-ABCD" 
             class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-center uppercase font-mono tracking-wider text-white focus:outline-none focus:border-blue-500">
      
      <button onclick="resgatarCodigo()" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-lg transition">
        Liberar Acesso &rarr;
      </button>

      <div id="mensagemErro" class="hidden p-3 bg-red-600/20 border border-red-500/30 text-red-400 text-sm text-center rounded-lg">
        Login não encontrado ou já entregue.
      </div>
    </div>

    <!-- Área onde aparecem os dados de IPTV após resgatar -->
    <div id="resultadoLogin" class="hidden space-y-4 pt-4 border-t border-slate-700">
      <div class="p-4 bg-slate-900 border border-slate-700 rounded-lg space-y-2">
        <h3 class="text-sm font-bold text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-circle-check"></i> Acesso Liberado com Sucesso!
        </h3>
        <div class="text-xs text-slate-300 space-y-1.5 pt-2">
          <div><strong>Usuário:</strong> <span id="resUsuario" class="font-mono text-white select-all"></span></div>
          <div><strong>Senha:</strong> <span id="resSenha" class="font-mono text-white select-all"></span></div>
          <div><strong>Servidor (DNS):</strong> <span id="resDns" class="font-mono text-white select-all"></span></div>
          <div id="resInstrucoesContainer" class="pt-2 border-t border-slate-800 hidden">
            <strong>Instruções:</strong>
            <p id="resInstrucoes" class="text-slate-400 mt-1"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center pt-2">
      <a href="https://t.me/seu_usuario" target="_blank" class="text-xs text-blue-400 hover:underline flex items-center justify-center gap-1">
        <i class="fa-brands fa-telegram"></i> Suporte / Comprar pelo Telegram
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wyjrjioipqfltdyupfna.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5anJqaW9pcHFmbHRkeXVwZm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMzc4MjIsImV4cCI6MjA5NDgxMzgyMn0.R913daESlpXfWeKuFOzn59kFPXgk7EZCONNTSd1w5NU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function resgatarCodigo() {
      const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
      const erroDiv = document.getElementById('mensagemErro');
      const resultadoDiv = document.getElementById('resultadoLogin');

      erroDiv.classList.add('hidden');
      resultadoDiv.classList.add('hidden');

      if (!codigo) {
        erroDiv.textContent = 'Digite um código válido.';
        erroDiv.classList.remove('hidden');
        return;
      }

      // 1. Busca o código no banco
      const { data: codigoData, error: errCodigo } = await _supabase
        .from('codigos')
        .select('*')
        .eq('codigo', codigo)
        .maybeSingle();

      if (errCodigo || !codigoData) {
        erroDiv.textContent = 'Login não encontrado ou já entregue.';
        erroDiv.classList.remove('hidden');
        return;
      }

      // 2. Verifica se já atingiu o limite de usos (ex: 2/2)
      const usosAtuais = codigoData.usos || 0;
      const limite = codigoData.limite || 2;

      if (usosAtuais >= limite || codigoData.usado) {
        erroDiv.textContent = 'Login não encontrado ou já entregue.';
        erroDiv.classList.remove('hidden');
        return;
      }

      // 3. Incrementa o uso em +1 no banco
      const novoUso = usosAtuais + 1;
      const { error: errUpdate } = await _supabase
        .from('codigos')
        .update({ 
          usos: novoUso, 
          usado: novoUso >= limite 
        })
        .eq('id', codigoData.id);

      if (errUpdate) {
        erroDiv.textContent = 'Erro ao processar resgate. Tente novamente.';
        erroDiv.classList.remove('hidden');
        return;
      }

      // 4. Busca os dados do login associado
      const { data: loginData, error: errLogin } = await _supabase
        .from('logins')
        .select('*')
        .eq('id', codigoData.login_id)
        .maybeSingle();

      if (errLogin || !loginData) {
        erroDiv.textContent = 'Erro ao carregar dados da conta.';
        erroDiv.classList.remove('hidden');
        return;
      }

      // 5. Exibe os dados na tela para o cliente
      document.getElementById('resUsuario').textContent = loginData.usuario;
      document.getElementById('resSenha').textContent = loginData.senha;
      document.getElementById('resDns').textContent = loginData.dns_url || 'Não informado';
      
      if (loginData.instrucoes) {
        document.getElementById('resInstrucoes').textContent = loginData.instrucoes;
        document.getElementById('resInstrucoesContainer').classList.remove('hidden');
      } else {
        document.getElementById('resInstrucoesContainer').classList.add('hidden');
      }

      resultadoDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKE LAVEX - Mural Público de Sites e Marcas</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Cabeçalho -->
  <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center text-white font-black tracking-wider text-xl shadow-lg shadow-indigo-500/20 border border-indigo-400/30">
        BL
      </div>
      <span class="font-bold text-lg tracking-wide text-white">BLACKE <span class="text-indigo-400">LAVEX</span></span>
    </div>
    
    <button onclick="abrirModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm px-4 py-2.5 rounded-xl font-semibold transition-all shadow-lg shadow-indigo-600/25 flex items-center gap-2 cursor-pointer">
      <i class="fa-solid fa-plus"></i>
      <span>Cadastrar Meu Site</span>
    </button>
  </header>

  <!-- Conteúdo Principal / Mural -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 space-y-8">
    
    <!-- Hero / Apresentação -->
    <div class="text-center space-y-3 py-6">
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white">
        Mural de Comunidades e Marcas
      </h1>
      <p class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto">
        Explore sites, canais e projetos recomendados pela comunidade. Cadastre o seu link de forma totalmente gratuita e exiba para todos!
      </p>
    </div>

    <!-- Grid de Cards (Onde os sites aparecem) -->
    <div id="muralGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Os cards são injetados via JavaScript aqui -->
    </div>

    <!-- Estado Vazio (Caso não tenha nada cadastrado) -->
    <div id="loadingState" class="text-center py-12 text-slate-500">
      <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
      <p>Carregando projetos...</p>
    </div>

  </main>

  <!-- Modal de Cadastro -->
  <div id="modalCadastro" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-globe text-indigo-400"></i> Cadastrar Novo Site / Marca
        </h3>
        <button onclick="fecharModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Nome da Marca / Site</label>
          <input type="text" id="inputNome" placeholder="Ex: Meu Portal VIP" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Link da Foto de Capa (URL da Imagem)</label>
          <input type="url" id="inputCapa" placeholder="https://exemplo.com/imagem.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Link de Acesso (URL)</label>
          <input type="url" id="inputLink" placeholder="https://seudominio.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Legenda Simples / Descrição</label>
          <textarea id="inputLegenda" rows="3" placeholder="Escreva uma breve descrição sobre o seu site ou grupo..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

        <div id="formErro" class="hidden text-red-400 text-xs text-center font-medium bg-red-500/10 border border-red-500/20 p-3 rounded-xl"></div>

        <button onclick="salvarSite()" id="btnSalvar" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-600/25 cursor-pointer">
          Publicar no Mural
        </button>
      </div>

    </div>
  </div>

  <!-- Rodapé -->
  <footer class="w-full py-6 text-center text-slate-500 text-xs border-t border-slate-900 mt-12">
    &copy; BLACKE LAVEX. Todos os direitos reservados.
  </footer>

  <!-- Script de Conexão e Lógica -->
  <script>
    const SUPABASE_URL = 'https://wyjrjioipqfltdyupfna.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5anJqaW9pcHFmbHRkeXVwZm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMzc4MjIsImV4cCI6MjA5NDgxMzgyMn0.R913daESlpXfWeKuFOzn59kFPXgk7EZCONNTSd1w5NU';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Funções de Modal
    function abrirModal() {
      document.getElementById('modalCadastro').classList.remove('hidden');
    }

    function fecharModal() {
      document.getElementById('modalCadastro').classList.add('hidden');
      document.getElementById('formErro').classList.add('hidden');
    }

    // Carregar os sites cadastrados ao abrir a página
    async function carregarMural() {
      const grid = document.getElementById('muralGrid');
      const loading = document.getElementById('loadingState');

      try {
        const { data, error } = await _supabase
          .from('sites_publicos')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        loading.style.display = 'none';
        grid.innerHTML = '';

        if (!data || data.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Nenhum site cadastrado ainda. Seja o primeiro!</div>`;
          return;
        }

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between hover:border-slate-700 transition-all group";
          
          card.innerHTML = `
            <div>
              <div class="h-48 w-full overflow-hidden bg-slate-950 relative">
                <img src="${item.image_url}" alt="${item.brand_name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500&auto=format&fit=crop'">
              </div>
              <div class="p-5 space-y-2">
                <h3 class="font-bold text-lg text-white tracking-wide">${item.brand_name}</h3>
                <p class="text-slate-400 text-xs leading-relaxed line-clamp-3">${item.caption || 'Sem descrição.'}</p>
              </div>
            </div>
            <div class="p-5 pt-0">
              <a href="${item.link_url}" target="_blank" class="w-full bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 py-3 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-sm">
                <span>Acessar Site</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        loading.innerHTML = `<p class="text-red-400">Erro ao carregar os dados do mural.</p>`;
      }
    }

    // Salvar novo site no banco
    async function salvarSite() {
      const nome = document.getElementById('inputNome').value.trim();
      const capa = document.getElementById('inputCapa').value.trim();
      const link = document.getElementById('inputLink').value.trim();
      const legenda = document.getElementById('inputLegenda').value.trim();
      const erroDiv = document.getElementById('formErro');
      const btn = document.getElementById('btnSalvar');

      erroDiv.classList.add('hidden');

      if (!nome || !capa || !link) {
        erroDiv.innerText = "Preencha pelo menos o Nome, o Link da Capa e o Link de Acesso!";
        erroDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publicando...`;

      try {
        const { error } = await _supabase.from('sites_publicos').insert([
          { brand_name: nome, image_url: capa, link_url: link, caption: legenda }
        ]);

        if (error) throw error;

        fecharModal();
        // Limpar campos
        document.getElementById('inputNome').value = '';
        document.getElementById('inputCapa').value = '';
        document.getElementById('inputLink').value = '';
        document.getElementById('inputLegenda').value = '';
        
        // Recarregar mural
        carregarMural();
      } catch (err) {
        erroDiv.innerText = "Erro ao publicar: " + err.message;
        erroDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Publicar no Mural";
      }
    }

    // Inicializar carregamento ao abrir a página
    carregarMural();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKE LAVEX - Mural Anônimo</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <!-- Cabeçalho Minimalista e Centralizado -->
  <header class="w-full bg-zinc-950 border-b border-zinc-900 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-2xl">
    
    <!-- Espaço Esquerdo / Vazio para equilibrar -->
    <div class="w-32 hidden sm:block"></div>

    <!-- Centro: Logo + Nome BLACKE LAVEX -->
    <div class="flex items-center gap-3 cursor-pointer" onclick="document.getElementById('logoFileInput').click()" title="Clique para alterar a logo">
      <input type="file" id="logoFileInput" accept="image/*" class="hidden" onchange="mudarLogo(event)">
      
      <div id="logoBox" class="h-10 w-10 bg-zinc-900 border border-zinc-800 rounded-xl flex items-center justify-center text-emerald-400 font-mono font-bold text-lg overflow-hidden shadow-inner">
        <i id="logoIcon" class="fa-solid fa-terminal"></i>
        <img id="logoImg" src="" alt="Logo" class="w-full h-full object-cover hidden">
      </div>
      
      <span class="font-mono font-extrabold tracking-widest text-base sm:text-lg text-white">BLACKE <span class="text-emerald-400">LAVEX</span></span>
    </div>

    <!-- Direita: Botão de Cadastrar com Cor Viva -->
    <div class="w-32 flex justify-end">
      <button onclick="abrirModal()" class="bg-emerald-500 hover:bg-emerald-400 text-black text-xs sm:text-sm px-4 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20 flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-plus"></i>
        <span class="hidden sm:inline">Cadastrar</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal / Mural Limpo -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 space-y-6">
    
    <!-- Grid de Cards (Mural Anônimo) -->
    <div id="muralGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pt-4">
      <!-- Cards injetados via JS -->
    </div>

    <!-- Estado de Carregamento -->
    <div id="loadingState" class="text-center py-20 text-zinc-600 font-mono text-sm">
      <i class="fa-solid fa-circle-notch fa-spin text-xl mb-2 text-emerald-500"></i>
      <p>CARREGANDO REDE...</p>
    </div>

  </main>

  <!-- Modal de Cadastro -->
  <div id="modalCadastro" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-800 rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between border-b border-zinc-900 pb-4">
        <h3 class="text-sm font-mono font-bold text-white flex items-center gap-2 uppercase tracking-wider">
          <i class="fa-solid fa-terminal text-emerald-400"></i> Nova Publicação
        </h3>
        <button onclick="fecharModal()" class="text-zinc-500 hover:text-white text-lg cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-4">
        
        <!-- Upload de Capa -->
        <div>
          <label class="block text-[10px] uppercase font-mono font-semibold text-zinc-400 mb-2">Foto de Capa</label>
          
          <div id="uploadArea" onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-zinc-800 hover:border-emerald-500/50 bg-zinc-900/50 rounded-2xl p-6 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-2 group">
            <i class="fa-solid fa-image text-3xl text-zinc-600 group-hover:text-emerald-400 transition-colors"></i>
            <span class="text-xs text-zinc-400 group-hover:text-zinc-200">Clique para carregar imagem</span>
          </div>

          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="processarImagem(event)">

          <div id="previewContainer" class="hidden relative mt-2 rounded-2xl overflow-hidden border border-zinc-800 h-48 bg-zinc-900">
            <img id="imagePreview" src="" alt="Prévia" class="w-full h-full object-cover">
            <button onclick="removerImagem()" class="absolute top-3 right-3 bg-red-600/90 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg text-xs cursor-pointer">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[10px] uppercase font-mono font-semibold text-zinc-400 mb-1">Nome da Marca / Site</label>
          <input type="text" id="inputNome" placeholder="Ex: Anonymous BR" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 font-mono">
        </div>

        <div>
          <label class="block text-[10px] uppercase font-mono font-semibold text-zinc-400 mb-1">Link de Acesso (URL)</label>
          <input type="url" id="inputLink" placeholder="https://" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 font-mono">
        </div>

        <div>
          <label class="block text-[10px] uppercase font-mono font-semibold text-zinc-400 mb-1">Legenda Simples</label>
          <textarea id="inputLegenda" rows="3" placeholder="Escreva uma descrição..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-white text-sm focus:outline-none focus:border-emerald-500 resize-none font-mono"></textarea>
        </div>

        <div id="formErro" class="hidden text-red-400 text-xs text-center font-mono bg-red-500/10 border border-red-500/20 p-3 rounded-xl"></div>

        <button onclick="salvarSite()" id="btnSalvar" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-mono font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 cursor-pointer uppercase text-xs tracking-wider">
          Publicar no Mural
        </button>
      </div>

    </div>
  </div>

  <!-- Rodapé -->
  <footer class="w-full py-6 text-center text-zinc-600 font-mono text-[10px] border-t border-zinc-900/80 mt-12">
    BLACKE LAVEX // SECURE NETWORK
  </footer>

  <!-- Script JS -->
  <script src="app.js"></script>
</body>
</html>
